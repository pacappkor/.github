# SPDX-License-Identifier: GPL-3.0-only
name: Reusable traffic counter
on:
  workflow_call:
    inputs:
      branch:
        description: Counting branch (must not be main)
        type: string
        default: traffic
      data-dir:
        description: Relative counting data directory
        type: string
        default: .traffic
    secrets:
      TRAFFIC_TOKEN:
        required: true
permissions:
  contents: write
concurrency:
  group: traffic-counter-${{ github.repository }}
  cancel-in-progress: false
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRAFFIC_BRANCH: ${{ inputs.branch }}
      TRAFFIC_DATA_DIR: ${{ inputs.data-dir }}
    steps:
      # Reusable workflows do not implicitly make their own scripts available.
      - name: Get central implementation (public repository, main channel)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pacappkor/.github
          ref: main
          persist-credentials: false
      - name: Preserve trusted implementation outside caller working tree
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/org-traffic-tools"
          cp scripts/traffic_update.py scripts/traffic_branch.py "$RUNNER_TEMP/org-traffic-tools/"
      - name: Check out caller with push credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Sync main into counting branch
        shell: bash
        run: python -I -B "$RUNNER_TEMP/org-traffic-tools/traffic_branch.py"
      - name: Fetch and accumulate traffic
        shell: bash
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          TRAFFIC_REPOSITORY: ${{ github.repository }}
        run: python -I -B "$RUNNER_TEMP/org-traffic-tools/traffic_update.py" --repository "$TRAFFIC_REPOSITORY" --data-dir "$TRAFFIC_DATA_DIR"
      - name: Commit only counting data and push normally
        shell: bash
        run: |
          set -euo pipefail
          git add -- "$TRAFFIC_DATA_DIR/views.json" "$TRAFFIC_DATA_DIR/clones.json" "$TRAFFIC_DATA_DIR/badge-views.json" "$TRAFFIC_DATA_DIR/badge-clones.json"
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily traffic counts"
          fi
          # Push even without data changes: the main merge may still be new.
          git push origin "HEAD:refs/heads/$TRAFFIC_BRANCH"
